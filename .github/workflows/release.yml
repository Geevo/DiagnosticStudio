name: Release

# Push a tag such as v1.2.0 to publish a release with both downloads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test DiagnosticStudio.sln --configuration Release --nologo

      - name: Publish and zip
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $out = New-Item -ItemType Directory -Force release
          $builds = @{ FrameworkDependent = 'framework-dependent'; SelfContained = 'self-contained' }
          foreach ($profile in $builds.Keys) {
            dotnet publish src/DiagnosticStudio.App -p:PublishProfile=$profile -p:Version=$version --nologo
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $profile" }
            $exe = "src/DiagnosticStudio.App/bin/publish/$($builds[$profile])/DiagnosticStudio.exe"
            Compress-Archive -Path $exe -DestinationPath "$out/DiagnosticStudio-${{ github.ref_name }}-win-x64-$($builds[$profile]).zip"
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem release/*.zip) --title '${{ github.ref_name }}' --generate-notes
